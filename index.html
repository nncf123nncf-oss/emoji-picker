<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>絵文字ピッカー</title>
<style>
  :root {
    --bg: #FFF8E1;
    --surface: #FFFFFF;
    --text-main: #2B2B2E;
    --text-sub: #6B6B72;
    --accent: #1E9E6B;
    --danger: #D93025;
    --border: #F0E4B8;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text-main);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .container {
    max-width: 480px;
    margin: 0 auto;
    padding: 16px;
  }
  header h1 {
    font-size: 18px;
    margin: 0 0 4px 0;
  }
  header p {
    font-size: 14px;
    color: var(--text-sub);
    margin: 0 0 16px 0;
  }
  .row {
    margin-bottom: 12px;
  }
  input[type="text"],
  select {
    width: 100%;
    min-height: 44px;
    font-size: 15px;
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--surface);
    color: var(--text-main);
    box-sizing: border-box;
    font-family: inherit;
  }
  input[type="text"]:focus,
  select:focus {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }
  #status {
    min-height: 24px;
    font-size: 14px;
    line-height: 24px;
    margin-bottom: 8px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #status.ok { color: var(--accent); }
  #status.err { color: var(--danger); }
  #grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(44px, 1fr));
    gap: 8px;
  }
  .emoji-btn {
    box-sizing: border-box;
    min-width: 44px;
    min-height: 44px;
    font-size: 22px;
    line-height: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
  }
  .emoji-btn:hover {
    border-color: var(--accent);
  }
  .emoji-btn:active {
    background: var(--border);
  }
  #empty {
    font-size: 14px;
    color: var(--text-sub);
    padding: 16px 0;
    display: none;
  }
  #count {
    font-size: 12px;
    color: var(--text-sub);
    margin-top: 16px;
    text-align: right;
  }
  /* --- 運営者表記フッタ（全Day共通・Day037と同一仕様） -------------------
     ページごとに配色が違うため、ページ側のCSS変数に依存せず自己完結させる。
     ツール本体のスタイルには触れない。印刷時は表示しない。 */
  .mw-footer {
    box-sizing: border-box;
    width: 100%;
    max-width: 100%;
    margin: 24px 0 0;
    padding: 16px;
    background: #F7F7F8;
    border: 1px solid #D8D8DC;
    border-radius: 6px;
    color: #3A3A3E;
    font-family: system-ui, sans-serif;
    font-size: 12px;
    font-weight: 400;
    line-height: 1.7;
    text-align: left;
    overflow-wrap: anywhere;
  }
  .mw-footer p { margin: 0 0 6px; padding: 0; color: #3A3A3E; font-size: 12px; font-weight: 400; line-height: 1.7; text-align: left; }
  .mw-footer p:last-child { margin-bottom: 0; }
  .mw-footer a { color: #0B5AA6; }
  .mw-footer.mw-footer--page { width: calc(100% - 32px); max-width: 720px; margin: 24px auto; }
  @media print { .mw-footer { display: none; } }
</style>
</head>

  <div id="status" aria-live="polite"></div>

  <div id="grid"></div>
  <p id="empty">見つかりませんでした。別のキーワードでお試しください。</p>
  <p id="count"></p>
  <footer class="mw-footer">

  function renderGrid(items) {
    gridEl.innerHTML = "";
    if (items.length === 0) {
      emptyEl.style.display = "block";
      return;
    }
    emptyEl.style.display = "none";
    items.forEach(function (pair) {
      var emoji = pair[0];
      var label = pair[1];
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "emoji-btn";
      btn.textContent = emoji;
      btn.title = label;
      btn.setAttribute("aria-label", label);
      btn.addEventListener("click", function () {
        copyToClipboard(emoji, label);
      });
      gridEl.appendChild(btn);
    });
  }

  function showStatus(text, ok) {
    if (statusTimer) { clearTimeout(statusTimer); }
    statusEl.textContent = text;
    statusEl.className = ok ? "ok" : "err";
    statusTimer = setTimeout(function () {
      statusEl.textContent = "";
      statusEl.className = "";
    }, 2500);
  }

  function copyToClipboard(emoji, label) {
    function onSuccess() {
      showStatus(emoji + " をコピーしました（" + label + "）", true);
    }
    function onFail() {
      showStatus("コピーできませんでした", false);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(emoji).then(onSuccess, function () {
        fallbackCopy(emoji, onSuccess, onFail);
      });
    } else {
      fallbackCopy(emoji, onSuccess, onFail);
    }
  }

  function fallbackCopy(text, onSuccess, onFail) {
    try {
      var ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.left = "-9999px";
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      var ok = document.execCommand("copy");
      document.body.removeChild(ta);
      if (ok) { onSuccess(); } else { onFail(); }
    } catch (e) {
      onFail();
    }
  }

  function applyFilter() {
    var keyword = searchInput.value.trim();
    if (keyword.length > 0) {
      var result = [];
      CATEGORIES.forEach(function (cat) {
        cat.items.forEach(function (pair) {
          if (pair[1].toLowerCase().indexOf(keyword.toLowerCase()) !== -1) {
            result.push(pair);
          }
        });
      });
      renderGrid(result);
    } else {
      var selected = CATEGORIES.filter(function (c) { return c.key === categorySelect.value; })[0];
      renderGrid(selected ? selected.items : []);
    }
  }

  searchInput.addEventListener("input", applyFilter);
  categorySelect.addEventListener("change", applyFilter);

  // 初期表示
  categorySelect.value = CATEGORIES[0].key;
  applyFilter();
